name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests (offline, deterministic; live API tests are skipped)
        run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mcp-research-agent:ci .
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
